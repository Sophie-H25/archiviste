services:
  archiviste:
    build: .
    image: ghcr.io/Sophie-H25/archiviste:latest
    container_name: archiviste
    ports:
      - "8080:8080"
    user: "568:568"            # même UID que l'utilisateur applicatif TrueNAS
    environment:
      ARCHIVISTE_RUNS: /data/runs
      ARCHIVISTE_DATA: /data
    volumes:
      # Seul répertoire inscriptible : runs, journaux, procédures apprises.
      - archiviste-data:/data
    restart: unless-stopped

volumes:
  archiviste-data:
